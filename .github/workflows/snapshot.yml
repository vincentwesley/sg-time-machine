name: Snapshot

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Fetch every feed regardless of schedule"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Zero dependencies: Node runs the TypeScript directly, so no npm ci.
      - name: Snapshot feeds
        env:
          ALL: ${{ inputs.all && '--all' || '' }}
        run: node scripts/snapshot.ts $ALL

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: snapshot $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M') SGT"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed"
            sleep 5
          done
          exit 1
